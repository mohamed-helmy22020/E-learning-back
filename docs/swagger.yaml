openapi: 3.0.0
info:
    title: E-Learning API
    version: 1.0.0
    description: API Documentation for E-Learning API
servers:
    - url: https://elearning.vercel.app/api
components:
    securitySchemes:
        BearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
paths:
    /auth/login:
        post:
            summary: Log in a user
            tags:
                - User Authentication
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                email:
                                    type: string
                                    format: email
                                password:
                                    type: string
            responses:
                "200":
                    description: Successful login
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    user:
                                        type: object
                                        properties:
                                            userId:
                                                type: string
                                            email:
                                                type: string
                                            phone:
                                                type: string
                                            name:
                                                type: string
                                            isEmailVerified:
                                                type: boolean
                                            isPhoneVerified:
                                                type: boolean
                                            userProfileImage:
                                                type: string
                                    accessToken:
                                        type: string
                            example:
                                user:
                                    userId: 67224b4a633c0c0003c88a45
                                    email: example@gmail.com
                                    phone: "+201000000000"
                                    name: FirstName LastName
                                    isEmailVerified: false
                                    isPhoneVerified: false
                                    userProfileImage: https://example.com/profile.jpg
                                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                "400":
                    description: Email or password missing
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    msg:
                                        type: string
                            example:
                                msg: Please provide email and password
                "401":
                    description: Invalid credentials
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    msg:
                                        type: string
                            example:
                                msg: Invalid Credentials
    /auth/register:
        post:
            summary: Register a new user
            tags:
                - User Authentication
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                email:
                                    type: string
                                    format: email
                                password:
                                    type: string
                                name:
                                    type: string
                                phone:
                                    type: string
            responses:
                "201":
                    description: User registered successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    user:
                                        type: object
                                        properties:
                                            userId:
                                                type: string
                                            email:
                                                type: string
                                            phone:
                                                type: string
                                            name:
                                                type: string
                                            isEmailVerified:
                                                type: boolean
                                            isPhoneVerified:
                                                type: boolean
                                            userProfileImage:
                                                type: string
                                    accessToken:
                                        type: string
                            example:
                                user:
                                    userId: 67224b4a633c0c0003c88a45
                                    email: example@gmail.com
                                    phone: "+201000000000"
                                    name: FirstName LastName
                                    isEmailVerified: false
                                    isPhoneVerified: false
                                    userProfileImage: https://example.com/profile.jpg
                                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                "400":
                    description: Missing required fields
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    msg:
                                        type: string
                            example:
                                msg: Email, password, and phone are required
    /auth/send-reset-code:
        post:
            summary: Send a password reset code to the user's email
            tags:
                - User Authentication
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                email:
                                    type: string
            responses:
                "200":
                    description: Reset code sent successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                    msg:
                                        type: string
                            example:
                                success: true
                                msg: Reset password code sent to your email
                "400":
                    description: Email is required
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    msg:
                                        type: string
                            example:
                                msg: Please provide email
                "404":
                    description: User with email not found
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    msg:
                                        type: string
                            example:
                                msg: No user with email example@gmail.com
    /auth/reset-password:
        post:
            summary: Reset the user's password
            tags:
                - User Authentication
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                email:
                                    type: string
                                code:
                                    type: integer
                                newPassword:
                                    type: string
            responses:
                "200":
                    description: Password reset successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                    msg:
                                        type: string
                            example:
                                success: true
                                msg: Password reset successfully
                "400":
                    description: Invalid code or missing fields
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    msg:
                                        type: string
                            example:
                                msg: Invalid code
                "404":
                    description: User with email not found
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    msg:
                                        type: string
                            example:
                                msg: No user with email petxtv@gmail.com
    /verify/email:
        post:
            summary: Verify a user's email with a code
            tags:
                - User Verification
            security:
                - BearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                code:
                                    type: integer
            responses:
                "200":
                    description: Email verified successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                    msg:
                                        type: string
                            example:
                                success: true
                                msg: Email verified successfully
                "400":
                    description: Invalid or missing verification code
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    msg:
                                        type: string
                            example:
                                msg: Invalid verification code
    /verify/send/email:
        post:
            summary: Send an email verification code
            tags:
                - User Verification
            security:
                - BearerAuth: []
            responses:
                "200":
                    description: Verification code sent successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                    msg:
                                        type: string
                            example:
                                success: true
                                msg: Verification code sent successfully
                "400":
                    description: Email is already verified
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    msg:
                                        type: string
                            example:
                                msg: Email is already verified
                "500":
                    description: Error sending verification code
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    msg:
                                        type: string
                            example:
                                msg: Failed to send verification code
    /user/data:
        get:
            summary: Get user data
            tags:
                - User Data
            security:
                - BearerAuth: []
            responses:
                "200":
                    description: get user data successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    userId:
                                        type: string
                                    email:
                                        type: string
                                    phone:
                                        type: string
                                    name:
                                        type: string
                                    isEmailVerified:
                                        type: boolean
                                    isPhoneVerified:
                                        type: boolean
                                    userProfileImage:
                                        type: string
                            example:
                                userId: 67224b4a633c0c0003c88a45
                                email: example@gmail.com
                                phone: "+201000000000"
                                name: FirstName LastName
                                isEmailVerified: false
                                isPhoneVerified: false
                                userProfileImage: https://example.com/profile.jpg
        post:
            summary: Update User Data
            tags:
                - User Data
            security:
                - BearerAuth: []
            requestBody:
                required: false
                content:
                    multipart/form-data:
                        schema:
                            type: object
                            properties:
                                email:
                                    type: string
                                    default: ""
                                phone:
                                    type: string
                                    default: ""
                                name:
                                    type: string
                                    default: ""
                                newPassword:
                                    type: string
                                    default: ""
                                currentPassword:
                                    type: string
                                    default: ""
                                profilePicture:
                                    type: string
                                    format: binary
                                    description: The image file to upload.
            responses:
                "200":
                    description: Update User Data
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    userId:
                                        type: string
                                    email:
                                        type: string
                                    phone:
                                        type: string
                                    name:
                                        type: string
                                    isEmailVerified:
                                        type: boolean
                                    isPhoneVerified:
                                        type: boolean
                                    userProfileImage:
                                        type: string
                            example:
                                userId: 67224b4a633c0c0003c88a45
                                email: example@gmail.com
                                phone: "+201000000000"
                                name: FirstName LastName
                                isEmailVerified: false
                                isPhoneVerified: false
                                userProfileImage: https://example.com/profile.jpg
                "401":
                    description: Error when no current password when changing password or email or
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    msg:
                                        type: string
                            example:
                                msg: Current password is incorrect
    /courses:
        get:
            summary: Get all courses data
            tags:
                - Courses Data
            security:
                - BearerAuth: []
            parameters:
                - name: title
                  in: query
                  description: Filter by title
                  required: false
                  schema:
                      type: string
                - name: description
                  in: query
                  description: Filter by description
                  required: false
                  schema:
                      type: string
                - name: category
                  in: query
                  description: Filter by category
                  required: false
                  schema:
                      type: string
                - name: numericFilters
                  in: query
                  description: get all data that (price and rating only) < ,	 > ,	 = ,	 <= or >= certin number
                  required: false
                  schema:
                      type: string
                - name: sort
                  in: query
                  description: sort data by certin items
                  required: false
                  schema:
                      type: string
                - name: fields
                  in: query
                  description: get only these fields
                  required: false
                  schema:
                      type: string
                - name: page
                  in: query
                  description: get page
                  required: false
                  schema:
                      type: number
                - name: limit
                  in: query
                  description: limit results
                  required: false
                  schema:
                      type: number
            responses:
                "200":
                    description: Successfully retrieved the courses
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    nbHits:
                                        type: integer
                                        example: 100
                                    courses:
                                        type: array
                                        items:
                                            type: object
                                            properties:
                                                courseId:
                                                    type: string
                                                title:
                                                    type: string
                                                description:
                                                    type: string
                                                category:
                                                    type: string
                                                instructor:
                                                    type: string
                                                duration:
                                                    type: string
                            example:
                                nbHits: 1
                                courses:
                                    - courseId: "12345"
                                      title: Introduction to Programming
                                      description: Learn the basics of programming.
                                      category: Computer Science
                                      instructor: John Doe
                                      duration: 4 weeks
        post:
            summary: Create a new course
            tags:
                - Courses Data
            security:
                - BearerAuth: []
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            type: object
                            properties:
                                title:
                                    type: string
                                description:
                                    type: string
                                price:
                                    type: string
                                category:
                                    type: string
                                coursePicture:
                                    type: string
                                    format: binary
                                    description: The image file to upload.
            responses:
                "201":
                    description: Course created successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    id:
                                        type: string
                                    title:
                                        type: string
                                    description:
                                        type: string
                                    price:
                                        type: string
                                    picture:
                                        type: string
                                    category:
                                        type: string
                                    rates:
                                        type: array
                                    rating:
                                        type: number
                            example:
                                id: 673f80618fd93e372cc54de5
                                title: photoshop
                                description: photoshop course
                                price: "20"
                                picture: https://example.com/wef.jpg
                                category: graphic design
                                rates:
                                    - 0
                                    - 0
                                    - 0
                                    - 0
                                    - 0
                                rating: 0
                "400":
                    description: Missing required fields
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    msg:
                                        type: string
                            example:
                                msg: >-
                                    Please provide title, description, price, category and course
                                    picture
    /courses/{courseId}:
        get:
            summary: Get a course by ID
            tags:
                - Courses Data
            security:
                - BearerAuth: []
            parameters:
                - name: courseId
                  in: path
                  required: true
                  schema:
                      type: string
                      description: The ID of the course to retrieve
            responses:
                "200":
                    description: Successfully retrieved the course
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    course:
                                        type: object
                                        properties:
                                            rates:
                                                type: array
                                                items:
                                                    type: integer
                                                description: Array of ratings
                                            rating:
                                                type: integer
                                                description: Calculated average rating
                                            _id:
                                                type: string
                                                description: Course ID
                                            instructorId:
                                                type: string
                                                description: Instructor ID
                                            title:
                                                type: string
                                                description: Title of the course
                                            description:
                                                type: string
                                                description: Description of the course
                                            price:
                                                type: string
                                                description: Price of the course
                                            category:
                                                type: string
                                                description: Category of the course
                                            picture:
                                                type: string
                                                format: uri
                                                description: URL to the course picture
                                            createdAt:
                                                type: string
                                                format: date-time
                                                description: Creation date of the course
                                            updatedAt:
                                                type: string
                                                format: date-time
                                                description: Last update date of the course
                                            __v:
                                                type: integer
                                                description: Version key for the document
                            example:
                                course:
                                    rates:
                                        - 0
                                        - 0
                                        - 0
                                        - 0
                                        - 0
                                    rating: 0
                                    _id: 673f80618fd93e372cc54we5
                                    instructorId: 673e45b7c8256w20449d5470
                                    title: photoshop
                                    description: photoshop course
                                    price: "20"
                                    category: graphic design
                                    picture: https://example.com/example.jpg
                                    createdAt: "2024-11-21T18:48:02.207Z"
                                    updatedAt: "2024-11-21T18:48:02.207Z"
                "400":
                    description: Invalid or missing course ID
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    msg:
                                        type: string
                            example:
                                msg: Please provide valid course id
                "404":
                    description: Course not found
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    msg:
                                        type: string
                            example:
                                msg: Course not found
